name: dubai_project
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_maps_flutter: ^2.5.3
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  location: ^6.0.2
  sliding_up_panel: ^2.0.0+1
  google_fonts: ^6.2.0
  dio: ^5.7.0
  shared_preferences: ^2.2.3
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  json_serializable: any
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/jsons/

  #   - images/a_dot_ham.jpeg

  # example:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
        - asset: assets/fonts/Inter_18pt-Light.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
